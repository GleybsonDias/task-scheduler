<ion-content [fullscreen]="true" class="configuracoes-content">
  <div class="configuracoes-wrapper">
    <!-- Header: Logotipo Taskly -->
    <header class="app-brand-row">
      <div class="brand-box">
        <div class="brand-icon-box">
          <ion-icon
            name="calendar-outline"
            class="brand-calendar-icon"
          ></ion-icon>
          <ion-icon
            name="checkmark-circle-outline"
            class="brand-check-icon"
          ></ion-icon>
        </div>
        <span class="brand-title">Taskly</span>
      </div>
    </header>

    <!-- Título Principal -->
    <section class="page-title-section">
      <h1 class="page-title">Perfil</h1>
    </section>

    <!-- Bloco de Destaque do Usuário -->
    <section class="user-info-card">
      <h2 class="user-display-name">{{ userName() }}</h2>
      <p class="user-display-email">{{ userEmail() }}</p>
    </section>

    <!-- Menu de Opções -->
    <section class="config-actions-list">
      <!-- Botão Editar Perfil -->
      <button
        type="button"
        class="config-action-btn"
        (click)="goToEditProfile()"
      >
        <div class="action-lead">
          <div class="action-icon-box edit-icon-box">
            <ion-icon name="create-outline"></ion-icon>
          </div>
          <span class="action-label">Editar Perfil</span>
        </div>
        <ion-icon
          name="chevron-forward-outline"
          class="action-chevron"
        ></ion-icon>
      </button>

      <!-- Botão Sair -->
      <button
        type="button"
        class="config-action-btn logout-btn"
        (click)="openLogoutModal()"
      >
        <div class="action-lead">
          <div class="action-icon-box logout-icon-box">
            <ion-icon name="log-out-outline"></ion-icon>
          </div>
          <span class="action-label">Sair</span>
        </div>
        <ion-icon
          name="chevron-forward-outline"
          class="action-chevron"
        ></ion-icon>
      </button>
    </section>
  </div>

  <!-- Caixa de Diálogo de Confirmação de Saída (Sem ion-modal) -->
  @if (isLogoutModalOpen()) {
  <div class="custom-modal-overlay" (click)="closeLogoutModal()">
    <div class="modal-dialog-card" (click)="$event.stopPropagation()">
      <div class="modal-icon-header">
        <ion-icon name="alert-circle-outline"></ion-icon>
      </div>
      <h3 class="modal-title">Deseja realmente sair?</h3>
      <p class="modal-message">
        Ao confirmar, sua sessão será encerrada e você precisará fazer login
        novamente para acessar suas tarefas.
      </p>

      <div class="modal-buttons-group">
        <button
          type="button"
          class="btn-modal-confirm"
          (click)="confirmLogout()"
        >
          Sim
        </button>

        <button
          type="button"
          class="btn-modal-cancel"
          (click)="closeLogoutModal()"
        >
          Não quero sair, voltar a tela anterior
        </button>
      </div>
    </div>
  </div>
  }
</ion-content>

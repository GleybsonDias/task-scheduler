<ion-content [fullscreen]="true" class="splash-content">
  <div class="splash-wrapper">
    <div class="brand-section">
      <!-- Ícone do Calendário com Check -->
      <div class="logo-icon">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect
            x="6"
            y="8"
            width="36"
            height="34"
            rx="8"
            stroke="#1d5ab9"
            stroke-width="3.5"
            fill="#ffffff"
          />
          <line
            x1="15"
            y1="4"
            x2="15"
            y2="10"
            stroke="#1d5ab9"
            stroke-width="3.5"
            stroke-linecap="round"
          />
          <line
            x1="33"
            y1="4"
            x2="33"
            y2="10"
            stroke="#1d5ab9"
            stroke-width="3.5"
            stroke-linecap="round"
          />
          <line
            x1="6"
            y1="16"
            x2="42"
            y2="16"
            stroke="#1d5ab9"
            stroke-width="3"
          />
          <path
            d="M16 28L22 34L32 23"
            stroke="#1d5ab9"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <h1 class="app-title">Taskly</h1>
      <p class="subtitle">Organize seu dia com<br />mais facilidade.</p>
    </div>
  </div>

  <!-- Ondas decorativas no rodapé -->
  <div class="waves-container">
    <svg viewBox="0 0 500 150" preserveAspectRatio="none">
      <path
        d="M0.00,49.98 C160.00,140.00 340.00,-20.00 500.00,49.98 L500.00,150.00 L0.00,150.00 Z"
        class="wave-back"
      ></path>
      <path
        d="M0.00,75.00 C180.00,-10.00 320.00,130.00 500.00,60.00 L500.00,150.00 L0.00,150.00 Z"
        class="wave-front"
      ></path>
    </svg>
  </div>
</ion-content>
